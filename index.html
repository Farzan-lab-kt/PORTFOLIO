<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Portfolio</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
    .portfolio-shell{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
    .section-frame{position:absolute;inset:0;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .45s ease,visibility 0s linear .45s;z-index:1;background:#000}
    .section-frame.is-active{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .45s ease,visibility 0s linear 0s;z-index:2}
    .section-frame iframe{display:block;width:100%;height:100%;border:0}
    .back-home{position:absolute;top:18px;left:18px;z-index:20;border:0;padding:9px 14px;background:rgba(0,0,0,.72);color:#fff;font:700 14px/1 Arial,sans-serif;cursor:pointer;letter-spacing:.04em}
    .back-home:hover{background:rgba(0,0,0,.86)}
    .back-home:focus-visible{outline:2px solid #fff;outline-offset:2px}
  </style>
</head>
<body>
  <main class="portfolio-shell" aria-label="Portfolio">
    <div class="section-frame section-frame--home is-active" id="homeFrameWrap">
      <iframe id="homeFrame" title="Portfolio Home" src="./home-section/index.html" sandbox="allow-same-origin allow-scripts"></iframe>
    </div>

    <div class="section-frame" id="projectsFrameWrap" aria-hidden="true">
      <iframe id="projectsFrame" title="My Projects" src="./my-projects-section/v14work/index.html" sandbox="allow-same-origin allow-scripts"></iframe>
    </div>

    <div class="section-frame" id="aboutFrameWrap" aria-hidden="true">
      <iframe id="aboutFrame" title="About Me" src="./about-contact-section/index.html" sandbox="allow-same-origin allow-scripts"></iframe>
    </div>

    <button class="back-home" id="backHome" type="button" aria-label="Back to Home" hidden>← HOME</button>
  </main>
  <script src="./portfolio-shell/integration.js"></script>
</body>
</html>
